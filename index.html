<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Shelby</title>

    <style>
        body {
            margin: 0;
            background: #111111;
            color: #f1e8d0;
            font-family: Georgia, serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #c9c0aa;
        }

        button {
            margin-top: 40px;
            padding: 18px 45px;
            font-size: 18px;
            background: transparent;
            color: #f1e8d0;
            border: 1px solid #f1e8d0;
            cursor: pointer;
        }

        button:hover {
            background: #f1e8d0;
            color: #111111;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CAFE SHELBY</h1>

        <p>
            Create Your Own Drink
        </p>

        <button onclick="startQuiz()">
            BUILD YOUR DRINK
        </button>

    </div>

    <script>
        function startQuiz() {
            alert("Drink Builder coming soon...");
        }
    </script>

</body>
</html>
