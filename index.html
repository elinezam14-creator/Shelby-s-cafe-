/* =====================================================
   CAFE SHELBY
   CLASSIC 1920s BRITISH STYLE
   NO EXTERNAL FONTS
===================================================== */


/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #292419 0%,
            #15130f 45%,
            #090909 100%
        );

    color: #e6d3a3;

    /*
       Persian:
       Georgia / Times New Roman / serif

       These are system fonts and do not
       require internet.
    */

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    text-align: center;

    -webkit-font-smoothing: antialiased;
}


/* =====================================================
   MAIN FRAME
===================================================== */

.container {

    width: calc(100% - 30px);

    max-width: 650px;

    min-height: calc(100vh - 30px);

    margin: 15px auto;

    padding: 50px 25px;

    border: 1px solid #a88a4a;

    outline: 1px solid #514326;

    outline-offset: 7px;

    position: relative;

    background:
        linear-gradient(
            180deg,
            rgba(30,27,20,.20),
            rgba(5,5,5,.08)
        );

}


/* INNER CLASSIC FRAME */

.container::before {

    content: "";

    position: absolute;

    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;

    border:
        1px solid
        rgba(168,138,74,.35);

    pointer-events: none;
}


/* =====================================================
   DECORATIVE CORNERS
===================================================== */

.container::after {

    content: "✦";

    position: absolute;

    top: 18px;

    left: 50%;

    transform: translateX(-50%);

    color: #a88a4a;

    font-size: 13px;

    background: #15130f;

    padding: 0 10px;
}


/* =====================================================
   TITLES
===================================================== */

h1 {

    /*
       English classic serif
    */

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: normal;

    font-size: 40px;

    letter-spacing: 5px;

    margin: 15px 0 8px;

    color: #e8d7a8;

    text-shadow:
        0 1px 1px #000;

}


h2 {

    /*
       Persian classic serif
    */

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: bold;

    font-size: 29px;

    margin: 15px 0 20px;

    color: #e8d7a8;

    text-shadow:
        0 1px 1px #000;

}


p {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    color: #c7b993;

    line-height: 2;

}


/* =====================================================
   CLASSIC GOLD LINE
===================================================== */

.shelby-line {

    width: 160px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a88a4a,
            transparent
        );

    margin: 20px auto;

    position: relative;
}


.shelby-line::before {

    content: "◆";

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 8px;

    color: #b99750;

    background: #17150f;

    padding: 0 7px;
}


.welcome {

    font-size: 20px;

    margin-bottom: 40px;

    color: #d2c39e;
}


/* =====================================================
   BUTTONS
===================================================== */

.main-button,
.option {

    display: block;

    width: 100%;

    margin: 16px 0;

    padding: 20px 15px;

    background:
        linear-gradient(
            145deg,
            rgba(67,57,37,.38),
            rgba(10,10,10,.94)
        );

    color: #e8d7a8;

    border:
        1px solid #8c7441;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    cursor: pointer;

    transition:
        .3s ease;

    position: relative;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.025);
}


.main-button {

    padding: 24px 15px;
}


/* CLASSIC SIDE DETAILS */

.main-button::before,
.option::before {

    content: "—";

    position: absolute;

    left: 12px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #806b3f;

    font-size: 13px;

}


.main-button::after,
.option::after {

    content: "—";

    position: absolute;

    right: 12px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #806b3f;

    font-size: 13px;

}


/* HOVER */

.main-button:hover,
.option:hover {

    background: #e8d7a8;

    color: #111;

    border-color: #e8d7a8;

    transform:
        translateY(-2px);

    box-shadow:
        0 5px 18px
        rgba(168,138,74,.15);
}


/* =====================================================
   ICON
===================================================== */

.icon {

    display: block;

    font-size: 28px;

    margin-bottom: 8px;

    filter:
        grayscale(25%);
}


/* =====================================================
   QUESTION NUMBER
===================================================== */

.question-number {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 13px;

    color: #8d7950;

    letter-spacing: 3px;

    margin-bottom: 10px;

    text-transform: uppercase;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    margin-top: 30px;

    color: #a89872;

    border-color: #5d4d31;

    font-size: 16px;
}


/* =====================================================
   MENU
===================================================== */

.menu-box {

    border:
        1px solid #806b3f;

    padding: 25px 18px;

    margin: 20px 0;

    position: relative;
}


/* INNER MENU FRAME */

.menu-box::before {

    content: "";

    position: absolute;

    top: 7px;
    left: 7px;
    right: 7px;
    bottom: 7px;

    border:
        1px solid
        rgba(128,107,63,.25);

    pointer-events: none;
}


.menu-item {

    padding: 18px 5px;

    border-bottom:
        1px solid #443a29;

    text-align: center;

    position: relative;
}


.menu-item:last-child {

    border-bottom: none;
}


.menu-item-name {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 19px;

    color: #e8d7a8;
}


/* =====================================================
   PRICE
===================================================== */

.menu-price {

    direction: ltr;

    display: block;

    margin-top: 8px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    letter-spacing: 1px;

    color: #c9a85c;
}


/* =====================================================
   RESULT
===================================================== */

.result {

    border:
        1px solid #a88a4a;

    padding: 25px;

    margin-top: 25px;

    text-align: right;

    background:
        rgba(0,0,0,.16);

    position: relative;
}


.result::before {

    content: "";

    position: absolute;

    top: 7px;
    left: 7px;
    right: 7px;
    bottom: 7px;

    border:
        1px solid
        rgba(168,138,74,.22);

    pointer-events: none;
}


.result p {

    margin: 8px 0;

    font-size: 16px;
}


.result strong {

    color: #e8d7a8;
}


/* =====================================================
   SECRET FLOATING BUTTON
===================================================== */

.secret-floating-button {

    position: fixed;

    bottom: 25px;

    left: 25px;

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #302918,
            #0c0c0c

    color: #e8d7a8;

    border:

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(168,138,74,.25);

    z-index: 999;

    transition:
        .3s ease;
}


.secret-floating-button:hover {

    transform:
        rotate(-8deg)
        scale(1.08);

    background: #e8d7a8;

    color: #111;

    box-shadow:
        0 0 25px
        rgba(232,215,168,.35);
}


/* =====================================================
   SECRET MENU
===================================================== */

.secret-reveal {

    animation:
        secretAppear .7s ease forwards;

    padding: 35px 15px;
}


.secret-symbol {

    font-size: 55px;

    margin-bottom: 15px;

    animation:
        hatAppear 1s ease;
}


.secret-drink-name {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: bold;

    font-size: 34px;

    color: #e8d7a8;

    margin: 25px 0 15px;

    letter-spacing: 1px;

    animation:
        drinkAppear 1s ease;
}


.secret-message {

    color: #a89872;

    font-size: 16px;

    margin: 20px 0 35px;

    animation:
        messageAppear 1.5s ease;
}


/* =====================================================
   SECRET ANIMATIONS
===================================================== */

@keyframes secretAppear {

    from {

        opacity: 0;

        transform:
            scale(.85)
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes hatAppear {

    from {

        opacity: 0;

        transform:
            translateY(-30px)
            rotate(-15deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            rotate(0);
    }
}


@keyframes drinkAppear {

    from {

        opacity: 0;

        letter-spacing: 10px;
    }

    to {

        opacity: 1;

        letter-spacing: 1px;
    }
}


@keyframes messageAppear {

    from {

        opacity: 0;
    }

    to {

        opacity: 1;
    }
}
