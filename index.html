<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Shelby</title>

    <style>

        body {
            margin: 0;
            background: #111111;
            color: #f1e8d0;
            font-family: Georgia, serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #c9c0aa;
            margin-bottom: 35px;
        }

        button {
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 18px 20px;
            font-size: 18px;
            background: transparent;
            color: #f1e8d0;
            border: 1px solid #f1e8d0;
            cursor: pointer;
        }

        button:hover {
            background: #f1e8d0;
            color: #111111;
        }

    </style>

</head>


<body>

<div class="container" id="app">

    <h1>CAFE SHELBY</h1>

    <p>
        نوشیدنی خودت را بساز
    </p>

    <button onclick="startBuilder()">
        BUILD YOUR DRINK
    </button>

</div>


<script>


let drink = {
    base: "",
    temperature: "",
    flavor: ""
};


function startBuilder() {

    document.getElementById("app").innerHTML = `

        <h1>نوشیدنی خودت را بساز</h1>

        <p>
            اول پایه نوشیدنی خودت را انتخاب کن
        </p>

        <button onclick="chooseBase('قهوه')">
            ☕ قهوه
        </button>

        <button onclick="chooseBase('چای')">
            🍵 چای
        </button>

        <button onclick="chooseBase('شیر')">
            🥛 شیر
        </button>

        <button onclick="chooseBase('بدون کافئین')">
            🍋 بدون کافئین
        </button>

    `;

}


function chooseBase(base) {

    drink.base = base;

    document.getElementById("app").innerHTML = `

        <h1>نوشیدنی خودت را بساز</h1>

        <p>
            نوشیدنی‌ات را سرد می‌خواهی یا گرم؟
        </p>

        <button onclick="chooseTemperature('سرد')">
            ❄️ سرد
        </button>

        <button onclick="chooseTemperature('گرم')">
            🔥 گرم
        </button>

    `;

}


function chooseTemperature(temperature) {

    drink.temperature = temperature;

    document.getElementById("app").innerHTML = `

        <h1>انتخاب طعم</h1>

        <p>
            چه طعمی دوست داری؟
        </p>

        <button onclick="chooseFlavor('شکلاتی')">
            🍫 شکلاتی
        </button>

        <button onclick="chooseFlavor('کاراملی')">
            🍮 کاراملی
        </button>

        <button onclick="chooseFlavor('میوه‌ای')">
            🍓 میوه‌ای
        </button>

        <button onclick="chooseFlavor('وانیلی')">
            🍦 وانیلی
        </button>

    `;

}


function chooseFlavor(flavor) {

    drink.flavor = flavor;

    document.getElementById("app").innerHTML = `

        <h1>نوشیدنی تو</h1>

        <p>
            پایه: ${drink.base}
        </p>

        <p>
            دما: ${drink.temperature}
        </p>

        <p>
            طعم: ${drink.flavor}
        </p>

        <p>
            نوشیدنی شما با موفقیت ساخته شد.
        </p>

    `;

}


</script>

</body>

</html>
