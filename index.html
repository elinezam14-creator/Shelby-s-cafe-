<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Shelby</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111111;
            color: #f1e8d0;
            font-family: Georgia, serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 50px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #c9c0aa;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .subtitle {
            margin-bottom: 45px;
        }

        .menu-button {
            display: block;
            width: 100%;
            margin: 18px 0;
            padding: 22px 20px;
            font-size: 19px;
            background: transparent;
            color: #f1e8d0;
            border: 1px solid #f1e8d0;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-button:hover {
            background: #f1e8d0;
            color: #111111;
        }

        .icon {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .question-number {
            font-size: 14px;
            color: #8f8878;
            margin-bottom: 10px;
        }

        .option {
            display: block;
            width: 100%;
            margin: 14px 0;
            padding: 18px 15px;
            font-size: 17px;
            background: transparent;
            color: #f1e8d0;
            border: 1px solid #f1e8d0;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: #f1e8d0;
            color: #111111;
        }

        .back-button {
            margin-top: 25px;
            border-color: #77705f;
            color: #aaa18d;
        }

        .result {
            border: 1px solid #f1e8d0;
            padding: 25px;
            margin-top: 30px;
            text-align: right;
        }

        .result p {
            margin: 8px 0;
            font-size: 16px;
        }

        .instagram {
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container" id="app">

    <h1>CAFE SHELBY</h1>

    <p class="subtitle">
        به دنیای شلبی خوش آمدید
    </p>


    <button class="menu-button" onclick="startBuilder()">

        <span class="icon">🥃</span>

        نوشیدنی خودت را بساز

    </button>


    <button class="menu-button" onclick="showMenu()">

        <span class="icon">📖</span>

        منوی کافه

    </button>


    <button class="menu-button" onclick="openInstagram()">

        <span class="icon">📸</span>

        اینستاگرام کافه

    </button>


</div>


<script>


let drink = {

    base: "",
    temperature: "",
    flavor: "",
    personality: "",
    risk: "",
    sweetness: "",
    topping: "",
    size: ""

};


function openInstagram() {

    window.open(
        "https://www.instagram.com/Shellbyscafe/",
        "_blank"
    );

}


function showMenu() {

    document.getElementById("app").innerHTML = `

        <h1>منوی کافه</h1>

        <p>
            منوی کافه شلبی
        </p>

        <p>
            این بخش به‌زودی با منوی کامل کافه شلبی تکمیل می‌شود.
        </p>

        <button class="option back-button" onclick="goHome()">
            ← بازگشت به صفحه اصلی
        </button>

    `;

}


function goHome() {

    location.reload();

}


function startBuilder() {

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۱ از ۸
        </div>

        <h2>پایه‌ی داستان</h2>

        <p>
            داستان نوشیدنی تو از کجا شروع بشه؟
        </p>

        <button class="option" onclick="chooseBase('اسپرسوی تلخ')">
            ☕ از یک اسپرسوی تلخ
        </button>

        <button class="option" onclick="chooseBase('چای آرام')">
            🍵 از یک چای آرام
        </button>

        <button class="option" onclick="chooseBase('طعم میوه‌ای')">
            🍓 از یک طعم میوه‌ای
        </button>

        <button class="option" onclick="chooseBase('نوشیدنی خنک')">
            🥂 از یک نوشیدنی خنک
        </button>

    `;

}


function chooseBase(base) {

    drink.base = base;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۲ از ۸
        </div>

        <h2>حال و هوای نوشیدنی</h2>

        <p>
            امروز نوشیدنی‌ات چه حال و هوایی داشته باشه؟
        </p>

        <button class="option" onclick="chooseTemperature('گرم و صمیمی')">
            🔥 گرم و صمیمی
        </button>

        <button class="option" onclick="chooseTemperature('خنک و سرحال')">
            ❄️ خنک و سرحال
        </button>

        <button class="option" onclick="chooseTemperature('آرام و مرموز')">
            🌙 آرام و مرموز
        </button>

        <button class="option" onclick="chooseTemperature('پرانرژی و جسور')">
            ⚡ پرانرژی و جسور
        </button>

    `;

}


function chooseTemperature(temperature) {

    drink.temperature = temperature;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۳ از ۸
        </div>

        <h2>وسوسه‌ات کدومه؟</h2>

        <p>
            اگر فقط یکی رو می‌تونستی انتخاب کنی...
        </p>

        <button class="option" onclick="chooseFlavor('شکلات')">
            🍫 شکلات
        </button>

        <button class="option" onclick="chooseFlavor('کارامل')">
            🍮 کارامل
        </button>

        <button class="option" onclick="chooseFlavor('توت‌فرنگی')">
            🍓 توت‌فرنگی
        </button>

        <button class="option" onclick="chooseFlavor('فندق')">
            🌰 فندق
        </button>

        <button class="option" onclick="chooseFlavor('مرکبات')">
            🍋 مرکبات
        </button>

    `;

}


function chooseFlavor(flavor) {

    drink.flavor = flavor;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۴ از ۸
        </div>

        <h2>شخصیت نوشیدنی</h2>

        <p>
            نوشیدنی تو باید چه شخصیتی داشته باشه؟
        </p>

        <button class="option" onclick="choosePersonality('تلخ و مرموز')">
            🖤 تلخ و مرموز
        </button>

        <button class="option" onclick="choosePersonality('شیرین و دوست‌داشتنی')">
            🤎 شیرین و دوست‌داشتنی
        </button>

        <button class="option" onclick="choosePersonality('جسور و هیجان‌انگیز')">
            ❤️ جسور و هیجان‌انگیز
        </button>

        <button class="option" onclick="choosePersonality('ظریف و لطیف')">
            🤍 ظریف و لطیف
        </button>

    `;

}


function choosePersonality(personality) {

    drink.personality = personality;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۵ از ۸
        </div>

        <h2>ریسک می‌کنی؟</h2>

        <p>
            چقدر اهل امتحان کردن طعم‌های جدیدی؟
        </p>

        <button class="option" onclick="chooseRisk('طعم‌های آشنا')">
            😌 همون چیزهای آشنا
        </button>

        <button class="option" onclick="chooseRisk('یه چیز متفاوت')">
            👀 یه چیز متفاوت
        </button>

        <button class="option" onclick="chooseRisk('سورپرایزم کن')">
            🔥 سورپرایزم کن
        </button>

        <button class="option" onclick="chooseRisk('کاملاً بسپار به شانس')">
            🎲 کاملاً بسپار به شانس
        </button>

    `;

}


function chooseRisk(risk) {

    drink.risk = risk;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۶ از ۸
        </div>

        <h2>میزان شیرینی</h2>

        <p>
            شیرینی رو چطور می‌پسندی؟
        </p>

        <button class="option" onclick="chooseSweetness('بدون شیرینی')">
            🖤 اصلاً شیرین نباشه
        </button>

        <button class="option" onclick="chooseSweetness('کم')">
            🤏 یه ذره
        </button>

        <button class="option" onclick="chooseSweetness('متعادل')">
            😋 متعادل
        </button>

        <button class="option" onclick="chooseSweetness('شیرین')">
            🍭 شیرین و جذاب
        </button>

    `;

}


function chooseSweetness(sweetness) {

    drink.sweetness = sweetness;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۷ از ۸
        </div>

        <h2>ضربه‌ی آخر</h2>

        <p>
            یه چیز اضافه کنیم که نوشیدنی خاص‌تر بشه؟
        </p>

        <button class="option" onclick="chooseTopping('خامه')">
            🍦 خامه
        </button>

        <button class="option" onclick="chooseTopping('شکلات')">
            🍫 شکلات
        </button>

        <button class="option" onclick="chooseTopping('فندق')">
            🌰 فندق
        </button>

        <button class="option" onclick="chooseTopping('میوه')">
            🍓 میوه
        </button>

        <button class="option" onclick="chooseTopping('یه ترکیب خاص')">
            ✨ یه ترکیب خاص
        </button>

        <button class="option" onclick="chooseTopping('بدون افزودنی')">
            ❌ نه، همین کافیه
        </button>

    `;

}


function chooseTopping(topping) {

    drink.topping = topping;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            مرحله ۸ از ۸
        </div>

        <h2>آخرین انتخاب</h2>

        <p>
            چقدر از نوشیدنی خودت می‌خوای؟
        </p>

        <button class="option" onclick="chooseSize('کوچیک و جمع‌وجور')">
            🥃 کوچیک و جمع‌وجور
        </button>

        <button class="option" onclick="chooseSize('استاندارد')">
            ☕ استاندارد
        </button>

        <button class="option" onclick="chooseSize('بزرگ و طولانی')">
            🥤 بزرگ و طولانی
        </button>

    `;

}


function chooseSize(size) {

    drink.size = size;

    showResult();

}


function showResult() {

    document.getElementById("app").innerHTML = `

        <h1>نوشیدنی تو آماده‌ست</h1>

        <p>
            این نوشیدنی رو خودت ساختی.
        </p>

        <div class="result">

            <p>
                ☕ <strong>پایه:</strong>
                ${drink.base}
            </p>

            <p>
                🌡️ <strong>حال و هوا:</strong>
                ${drink.temperature}
            </p>

            <p>
                🍫 <strong>طعم:</strong>
                ${drink.flavor}
            </p>

            <p>
                🎭 <strong>شخصیت:</strong>
                ${drink.personality}
            </p>

            <p>
                🎲 <strong>ریسک:</strong>
                ${drink.risk}
            </p>

            <p>
                🍬 <strong>شیرینی:</strong>
                ${drink.sweetness}
            </p>

            <p>
                ✨ <strong>افزودنی:</strong>
                ${drink.topping}
            </p>

            <p>
                🥤 <strong>حجم:</strong>
                ${drink.size}
            </p>

        </div>

        <button class="option" onclick="startBuilder()">
            دوباره بساز
        </button>

        <button class="option back-button" onclick="goHome()">
            ← صفحه اصلی
        </button>

    `;

}


</script>


</body>

</html>
